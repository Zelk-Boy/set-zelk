<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum "Hello World"</title>
    <style>
        /* CSS Custom Properties & Performance Optimization */
        :root {
            --bg-gradient: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            --accent-color: #00f2ff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg-gradient);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #webgl-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Glassmorphic Interactive UI Overlay */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        button {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        button:hover {
            background: var(--accent-color);
            color: #000000;
            box-shadow: 0 0 15px var(--accent-color);
        }
    </style>
    <!-- Three.js Library for GPU-accelerated 3D graphics -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div class="ui-container">
        <button id="audio-btn">Trigger Web Audio</button>
        <button id="color-btn">Shift Dimension</button>
    </div>

    <script>
        // --- 1. WEBGL ENGINE INITIALIZATION ---
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        
        // Perspective Camera Setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        // WebGL Renderer with Antialiasing and Hardware Acceleration
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- 2. GENERATIVE MATH & PARTICLES ("HELLO WORLD") ---
        // Simulating text layout via math functions instead of flat DOM elements
        const particleCount = 1500;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        // Algorithmic Point Positioning (Simulating complex wave patterns)
        for(let i = 0; i < particleCount * 3; i += 3) {
            // Mathematical clustering
            positions[i] = (Math.random() - 0.5) * 40;     // X axis
            positions[i+1] = (Math.random() - 0.5) * 20;   // Y axis
            positions[i+2] = (Math.random() - 0.5) * 10;   // Z axis

            // Visual spectrum distribution
            colors[i] = Math.random();                     // R
            colors[i+1] = Math.random();                   // G
            colors[i+2] = 1.0;                             // B
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Shader Material Simulation
        const material = new THREE.PointsMaterial({
            size: 0.35,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // Global lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        // --- 3. ADVANCED WEB AUDIO API INTEGRATION ---
        let audioCtx;
        function playSynthesizedTone() {
            // Lazy initialization to conform with browser security policies
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            // Algorithmic frequency assignment (C4 Chord harmony)
            const frequencies = [261.63, 329.63, 392.00, 523.25];
            const randomFreq = frequencies[Math.floor(Math.random() * frequencies.length)];
            oscillator.frequency.setValueAtTime(randomFreq, audioCtx.currentTime);
            
            // Linear volume decay envelope to protect hearing
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 1.5);
        }

        // --- 4. ASYNCHRONOUS EVENT INTERACTION ---
        document.getElementById('audio-btn').addEventListener('click', playSynthesizedTone);
        
        document.getElementById('color-btn').addEventListener('click', () => {
            const colors = particleSystem.geometry.attributes.color.array;
            for(let i = 0; i < colors.length; i++) {
                colors[i] = Math.random();
            }
            particleSystem.geometry.attributes.color.needsUpdate = true;
        });

        // Responsive Viewport Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 5. ULTRA-LOW LATENCY ANIMATION LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const elapsedTime = clock.getElapsedTime();

            // Kinetic physics calculations running on every frame tick
            particleSystem.rotation.y = elapsedTime * 0.15;
            particleSystem.rotation.x = Math.sin(elapsedTime * 0.2) * 0.1;

            // Mathematical waving of vertices
            const positions = particleSystem.geometry.attributes.position.array;
            for(let i = 1; i < positions.length; i += 3) {
                positions[i] += Math.sin(elapsedTime + positions[i-1]) * 0.01; 
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }

        // Execute engine loop
        animate();
    </script>
</body>
</html>
